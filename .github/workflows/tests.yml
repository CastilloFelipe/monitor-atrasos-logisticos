# PASO 8.6: corre los tests en GitHub en cada push y pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# [Paso 8.8] El workflow solo necesita leer el código
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Paso 1 - Cargar datos a SQLite
        run: python cargar_bd.py

      - name: Paso 3 - Entrenar el modelo
        run: python entrenar_modelo.py

      - name: Paso 8.5 - Tests
        run: pytest -v
